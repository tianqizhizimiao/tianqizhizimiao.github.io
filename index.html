<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TqZzMiao の Blog</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <!-- 加载背景覆盖层：从浏览器主题色渐变到设置的主题色，避免首帧白/黑突现 -->
    <div class="boot-bg" aria-hidden="true"></div>

    <!-- 层2：独立磨砂层（纯模糊，无底色） -->
    <div class="bg-blur" aria-hidden="true"></div>
    <!-- 层3：主题罩（半透明主题底色，负责揭幕渐变） -->
    <div class="bg-tint" aria-hidden="true"></div>

    <!-- 内容层 -->
    <div class="page">
      <main class="hero">
        <h1 class="hero-title">欢迎来到TqZzMiaoのBlog</h1>
      </main>
    </div>

    <!-- 加载指示器（仅横屏显示，右下角，Windows 11 风格旋转圆点，跟随主题色） -->
    <div class="loader" aria-live="polite">
      <div class="loader-title">正在加载必要资源</div>
      <div class="loader-dots"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="loader-sub">由于TqZzMiaoのServer是个土豆 <br class="br-mobile" /> 所以可能需要一点时间</div>
    </div>

    <script>
      // 加载背景覆盖层：从"浏览器主题色"渐变到"设置的主题色"，再淡出。
      // 这样页面加载时先呈现浏览器色，再平滑过渡到主题色，不突兀。
      (function () {
        var boot = document.querySelector('.boot-bg');
        if (!boot) return;
        // 系统色调判断：浅色(白) 或 暗色(黑)
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (isDark) {
          // 系统已是黑：不做任何事，直接保持暗色（boot-bg 也设为暗色，避免白闪）
          boot.style.backgroundColor = '#000000';
        } else {
          // 系统是白：初始白 → 渐变到黑（2s）
          boot.style.backgroundColor = '#ffffff';
          setTimeout(function () {
            boot.style.backgroundColor = '#000000';
          }, 500);
        }

        // 等图片/字体加载后淡出 boot-bg
        var reveal = function () {
          setTimeout(function () { boot.classList.add('done'); }, 300);
        };
        window.addEventListener('load', reveal);
        setTimeout(reveal, 3500); // 兜底
      })();
    </script>
    <script src="./javascripts/index.js"></script>
    <!-- init 基础设施：注册工具 + 保底3秒 + 独立监控 -->
    <script src="./javascripts/init.js"></script>
    <!-- 业务主干：注入 main.html -->
    <script src="./javascripts/init_main.js"></script>
    <script>
      // 用户在这个页面停留超过 15s 就替换提示文案（与加载是否完成无关）
      (function () {
        var sub = document.querySelector('.loader-sub');
        if (!sub) return;
        setTimeout(function () {
          sub.innerHTML = 'TqZzMiaoの土豆可能熟了<br class="br-mobile" />不建议继续等待';
        }, 15000);
      })();
    </script>
  </body>
</html>
