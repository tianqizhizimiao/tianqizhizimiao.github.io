<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TqZzMiaoのBlog</title>
    <!-- 独立 css 文件：main.html 位于 html/ 下，css 位于 css/ 下 -->
    <link rel="stylesheet" href="../css/main.css" />
    <!-- markdown 代码高亮主题 -->
    <link rel="stylesheet" href="../javascripts/lib/highlight-theme.css" />
    <!-- 第三方库：markdown-it（md 渲染）+ highlight.js（代码高亮）——先于 main.js 加载 -->
    <script src="../javascripts/lib/markdown-it.min.js"></script>
    <script src="../javascripts/lib/highlight.min.js"></script>
    <!-- 独立 js 文件：页面逻辑（菜单开合等） -->
    <script src="../javascripts/main.js"></script>
  </head>
  <body>
    <div class="main-shell">
      <!-- 顶部菜单栏 -->
      <header class="topbar">
        <!-- 汉堡按钮（移动端显示） -->
        <button class="hamburger" id="hamburger" aria-label="菜单">
          <span></span><span></span><span></span>
        </button>
        <div class="brand-wrap">
          <div class="brand">TqZzMiaoのBlog</div>
          <div class="breadcrumb" id="breadcrumb"></div>
        </div>
        <!-- 右侧选项（PC 显示在顶栏） -->
        <nav class="nav">
          <a href="#about">关于</a>
          <a href="#about-blog">关于此Blog</a>
          <a href="#author">作者</a>
        </nav>
      </header>

      <!-- 内容区：保留容器，默认只有居中的加载动画（不预渲染内容） -->
      <main class="content" id="content-area">
        <div class="content-loading" id="content-loading">
          <span class="loading-spinner"></span>
        </div>
        <!-- 透明 iframe：.html 内容内嵌用（占满内容区，加载完才显示） -->
        <iframe class="content-frame" id="content-frame" frameborder="0" allowtransparency="true"></iframe>
      </main>
    </div>

    <!-- 移动端：侧边抽屉（左侧滑出）+ 遮罩 -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="drawer" id="drawer">
      <!-- 菜单标题栏：标题 + 关闭(右)，仅图标简约风格 -->
      <div class="drawer-headbar">
        <span class="drawer-title">菜单</span>
        <button class="drawer-icon" id="close-btn" title="关闭菜单">✕</button>
      </div>
      <!-- 菜单内容由 main.js 读各层 config.txt 动态生成 -->
      <div id="menu-tree">
        <!-- 动态菜单项将在此填充 -->
      </div>
    </aside>
  </body>
</html>
